# ===========================================================================
# DibujadorProcesosWeb - configuracion base
# ===========================================================================
spring.application.name=DibujadorProcesosWeb

# ---------------------------------------------------------------------------
# Carga del archivo `.env` para EJECUCION LOCAL (fuera de Docker).
#
# `optional:` significa que si el archivo no existe la aplicacion arranca
# igualmente: dentro de Docker no hay `.env` (esta excluido por
# .dockerignore) porque las variables llegan del entorno del contenedor.
#
# Asi `.env` es la unica fuente de verdad de las credenciales locales:
# la consume Docker Compose de forma nativa y Spring Boot mediante esta linea.
# ---------------------------------------------------------------------------
spring.config.import=optional:file:./.env[.properties]

# ---------------------------------------------------------------------------
# Origen de datos: PostgreSQL (unico motor del proyecto).
#
# Sin credenciales literales. Todo proviene de variables de entorno.
#
#   - Ejecucion local : DB_HOST/DB_PORT por defecto apuntan a localhost:5433,
#                       que es el puerto que Docker Compose publica en el host
#                       (mapeo 5433:5432, elegido para no chocar con un
#                       PostgreSQL instalado en el 5432).
#
#   - Dentro de Docker: el servicio `app` recibe SPRING_DATASOURCE_URL,
#                       SPRING_DATASOURCE_USERNAME y SPRING_DATASOURCE_PASSWORD
#                       desde docker-compose.yml, que tienen prioridad sobre
#                       estos valores y apuntan al host `db` en el puerto 5432.
#
# POSTGRES_PASSWORD no tiene valor por defecto a proposito: si falta, la
# aplicacion falla al arrancar con un error explicito en lugar de intentar
# conectarse con una contrasena vacia. Solucion: `cp .env.example .env`.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:dibujador_procesos}
spring.datasource.username=${POSTGRES_USER:dibujador_app}
spring.datasource.password=${POSTGRES_PASSWORD}

# Tiempo maximo esperando una conexion libre del pool. El valor por defecto de
# HikariCP son 30 s: con PostgreSQL caido, /actuator/health se quedaba colgado
# medio minuto antes de responder y el healthcheck del contenedor abortaba por
# timeout en lugar de obtener una respuesta. Con 5 s el endpoint responde
# DOWN (HTTP 503) de forma rapida y determinista.
spring.datasource.hikari.connection-timeout=5000

# ---------------------------------------------------------------------------
# JPA / Hibernate
#
# NOTA DE BLOQUE: las tres propiedades temporales que permitian arrancar sin
# PostgreSQL (`hikari.initialization-fail-timeout=-1`,
# `hibernate.boot.allow_jdbc_metadata_access=false` y
# `spring.jpa.database-platform`) fueron ELIMINADAS en este bloque. Ahora
# existe PostgreSQL real: Hibernate negocia el dialecto contra el servidor y
# Hikari falla rapido si la conexion no funciona, que es el comportamiento
# deseado.
#
# ddl-auto=none: el esquema NO se genera automaticamente. Todavia no hay
# entidades; la estrategia de esquema (Flyway u otra) se decidira en el
# bloque del modelo de dominio.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Thymeleaf: sin cache en desarrollo para ver los cambios sin reiniciar.
# ---------------------------------------------------------------------------
spring.thymeleaf.cache=false

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Actuator - superficie minima
#
# Solo se expone `health` por HTTP; el resto de endpoints (env, beans,
# configprops, loggers, mappings, threaddump, heapdump...) quedan fuera.
# `show-details=never` evita filtrar detalles de infraestructura (motor de
# base de datos, espacio en disco) a quien consulte el endpoint sin
# autenticacion, ya que Spring Security todavia no forma parte del proyecto.
#
# El indicador interno de base de datos sigue funcionando aunque no se
# muestre: si PostgreSQL cae, /actuator/health responde DOWN con HTTP 503.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
