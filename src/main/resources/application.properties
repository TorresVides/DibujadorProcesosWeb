spring.application.name=DibujadorProcesosWeb

# Carga .env en ejecución local. Dentro de Docker no existe: las variables llegan del contenedor.
spring.config.import=optional:file:./.env[.properties]

# Credenciales siempre por variable de entorno. En Docker, SPRING_DATASOURCE_* tiene prioridad.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:dibujador_procesos}
spring.datasource.username=${POSTGRES_USER:dibujador_app}
spring.datasource.password=${POSTGRES_PASSWORD}

# Con el valor por defecto de Hikari (30s), /actuator/health tardaba medio minuto en reportar DOWN.
spring.datasource.hikari.connection-timeout=5000

# El esquema se controla a mano desde schema.sql; Hibernate no crea ni altera tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# `embedded` (el valor por defecto) solo ejecutaría schema.sql contra bases embebidas.
# Spring Boot ya ordena la inicialización: el EntityManagerFactory espera a que el script
# termine, así que no hace falta ninguna otra propiedad. El script es idempotente.
spring.sql.init.mode=always

spring.thymeleaf.cache=false

server.port=${SERVER_PORT:8080}

# Solo se expone el endpoint de salud.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
