name: dibujadorprocesos

services:

  db:
    image: postgres:16-alpine
    container_name: dibujadorprocesos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # PostgreSQL se publica en 5433 para evitar conflictos con instalaciones locales en el 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # El doble $$ deja que la variable la resuelva el shell del contenedor, no Compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dibujador-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dibujadorprocesos-app:local
    container_name: dibujadorprocesos-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Host `db` y puerto interno 5432: dentro del contenedor, localhost sería la propia app.
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    # timeout mayor que el connection-timeout de Hikari (5s) para recibir el 503 en vez de abortar.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - dibujador-net

volumes:
  pgdata:
    name: dibujadorprocesos_pgdata

networks:
  dibujador-net:
    driver: bridge
