#
# Este archivo proviene de la plantilla academica (fis_boilerplate) y NO
# corresponde todavia a DibujadorProcesosWeb.
#
# ESTADO ACTUAL: INERTE.
#   No existe ningun workflow activo que lo ejecute. El workflow de Sonar
#   heredado fue desactivado y se conserva como
#   .github/workflows/Sonar.yml.disabled
#
# Las dos claves que traia la plantilla estaban ACTIVAS y apuntaban al
# proyecto de la plantilla, no al nuestro:
#
#     sonar.projectKey=puj-course_Repository_Template_FIS
#     sonar.organization=puj-course
#
# Se dejan comentadas mas abajo, unicamente como referencia de su origen.
# Estan COMENTADAS a proposito para que no puedan usarse por accidente si
# alguien reactivara el analisis: ejecutarlas reportaria las metricas de este
# proyecto contra un proyecto ajeno, o fallaria por permisos.
#
# NO se han escrito valores de reemplazo. Inventar un projectKey o una
# organization ficticios seria peor que dejarlo vacio: pareceria
# configuracion real y podria quedar commiteado como si estuviera resuelto.
#
# QUE FALTA PARA COMPLETARLO (bloque de calidad, pendiente):
#   1. Crear el proyecto propio en SonarQube/SonarCloud y tomar de alli el
#      `sonar.projectKey` y la `sonar.organization` reales.
#   2. Generar el secret SONAR_TOKEN correspondiente en el repositorio.
#   3. Definir `sonar.sources=src/main/java` y `sonar.tests=src/test/java`
#      (hoy `sonar.sources` esta comentado, asi que se analizaria todo el
#      repositorio).
#   4. Configurar JaCoCo en el pom.xml y enlazar el reporte con
#      `sonar.coverage.jacoco.xmlReportPaths`; sin esto la cobertura seria 0%.
#   5. Reescribir el workflow para ejecutar el analisis DESPUES de compilar
#      con Maven (`./mvnw verify` + goal `sonar:sonar`), ya que el escaner
#      generico no analiza Java sin clases compiladas.
#
# Alternativa a evaluar en ese momento: eliminar este archivo y trasladar la
# configuracion al pom.xml, que es lo recomendado en proyectos Maven.
# ===========================================================================


